<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>App Secuenciado Ford</title>
<style>
  body { font-family: Arial, sans-serif; margin:0; padding:10px; background:#f2f2f2; }
  h2 { text-align:center; color:#003478; }
  .paso { display:none; background:white; border-radius:10px; padding:15px; margin-bottom:10px; box-shadow:0 1px 4px rgba(0,0,0,0.2);}
  .paso.activo { display:block; }
  button { background:#003478; color:white; border:none; padding:12px 18px; border-radius:8px; font-size:16px; margin:5px 0; width:100%; }
  button.secundario { background:#888; }
  button.vuelta { background:#1a7a3c; }
  button.quitar { background:#c0392b; width:auto; padding:6px 10px; font-size:13px; }
  #resultado { text-align:center; font-weight:bold; margin:8px 0; }
  #estadoDatos { text-align:center; font-size:13px; padding:6px; margin-bottom:8px; border-radius:6px; background:#eee; color:#555; }
  #reader, #reader2, #reader4, #reader5 { width:100%; }
  ul#listaCarros, ul#listaCarrosVuelta { list-style:none; padding:0; }
  ul#listaCarros li, ul#listaCarrosVuelta li { background:#eef; margin:4px 0; padding:8px; border-radius:6px; display:flex; justify-content:space-between; align-items:center; }
  .badge { display:inline-block; background:#003478; color:white; border-radius:50%; width:26px; height:26px; text-align:center; line-height:26px; margin-right:8px;}
  .badge.vuelta { background:#1a7a3c; }
  .info { background:#fff3cd; padding:8px; border-radius:6px; margin:8px 0; font-size:14px; }
</style>
</head>
<body>

<h2>Secuenciado Ford</h2>
<div id="estadoDatos" onclick="cargarMaestros()">Cargando datos...</div>

<div id="paso2" class="paso activo">
  <p><span class="badge">1</span> Escaneá el QR del <b>Camión</b></p>
  <div id="reader2"></div>
  <button onclick="iniciarScanner('reader2', procesarCamion)">Escanear QR</button>
</div>

<div id="paso4" class="paso">
  <p><span class="badge">2</span> Escaneá los <b>Carros</b> (la cámara queda abierta, escaneá uno tras otro)</p>
  <div class="info" id="infoViaje"></div>
  <div id="reader4"></div>
  <ul id="listaCarros"></ul>
  <button class="secundario" onclick="finalizarViaje()">Finalizar y Guardar Viaje</button>
</div>

<div id="paso5" class="paso">
  <p><span class="badge vuelta">V</span> <b>Vuelta detectada.</b> Escaneá los carros vacios que vuelven (opcional)</p>
  <div class="info" id="infoVuelta"></div>
  <div id="reader5"></div>
  <ul id="listaCarrosVuelta"></ul>
  <button class="vuelta" onclick="finalizarVuelta()">Finalizar Vuelta</button>
</div>

<div id="resultado"></div>

<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script>
  var API_URL = "https://script.google.com/macros/s/AKfycbxXj3O-W8tjfnGcgVngqoGDDvBn0Be54MSh42dHlJ30EKbzhvXgp1wh-RUj1B7N03oYSA/exec";

  var maestros = null;
  var scannerActivo = null;
  var scannerContinuoActivo = null;
  var bloqueoLectura = false;
  var viaje = viajeVacio();
  var vuelta = vueltaVacia();

  function viajeVacio(){
    return { camionCodigo:'', camionInfo:'', destinoCodigo:'', destinoInfo:'', destinoFamilia:'', carros: [], fecha:'', hora:'' };
  }

  function vueltaVacia(){
    return { camionCodigo:'', camionInfo:'', carros: [], fecha:'', hora:'' };
  }

  function obtenerFechaHoraLocal(){
    var ahora = new Date();
    var dd = String(ahora.getDate()).padStart(2,'0');
    var mm = String(ahora.getMonth()+1).padStart(2,'0');
    var yyyy = ahora.getFullYear();
    var hh = String(ahora.getHours()).padStart(2,'0');
    var mi = String(ahora.getMinutes()).padStart(2,'0');
    var ss = String(ahora.getSeconds()).padStart(2,'0');
    return {
      fecha: dd + '/' + mm + '/' + yyyy,
      hora: hh + ':' + mi + ':' + ss
    };
  }

  function cargarMaestros(){
    var estado = document.getElementById('estadoDatos');
    estado.innerText = 'Cargando datos...';
    estado.style.background = '#eee';
    estado.style.color = '#555';

    fetch(API_URL + "?action=maestros")
      .then(function(res){ return res.json(); })
      .then(function(data){
        maestros = data;
        var nc = (data.camiones||[]).length;
        var nd = (data.destinos||[]).length;
        var nt = (data.tipos||[]).length;
        estado.innerText = 'Datos listos (Camiones: ' + nc + ', Destinos: ' + nd + ', Tipos: ' + nt + ')';
        estado.style.background = '#d4edda';
        estado.style.color = '#155724';
      })
      .catch(function(err){
        estado.innerText = 'Error cargando datos. Tocá aca para reintentar. (' + err + ')';
        estado.style.background = '#f8d7da';
        estado.style.color = '#721c24';
      });
  }

  cargarMaestros();
  mostrarPaso(2);

  function mostrarPaso(n){
    document.querySelectorAll('.paso').forEach(function(p){ p.classList.remove('activo'); });
    document.getElementById('paso'+n).classList.add('activo');
  }

  // Scanner de una sola lectura (se usa para el Camion)
  function iniciarScanner(elementId, callback){
    function abrirCamara(){
      var html5QrCode = new Html5Qrcode(elementId);
      scannerActivo = html5QrCode;
      var yaLeido = false;

      html5QrCode.start(
        { facingMode: "environment" },
        { fps: 10, qrbox: 220 },
        function(decodedText){
          if (yaLeido) return;
          yaLeido = true;
          html5QrCode.stop().then(function(){
            scannerActivo = null;
            procesarConCallback(callback, decodedText.trim());
          }).catch(function(){
            scannerActivo = null;
            procesarConCallback(callback, decodedText.trim());
          });
        },
        function(err){}
      ).catch(function(err){
        document.getElementById('resultado').innerText = "No se pudo acceder a la camara: " + err;
      });
    }

    if (scannerActivo){
      scannerActivo.stop().then(function(){
        scannerActivo = null;
        setTimeout(abrirCamara, 300);
      }).catch(function(){
        scannerActivo = null;
        setTimeout(abrirCamara, 300);
      });
    } else {
      abrirCamara();
    }
  }

  // Scanner continuo: no se detiene entre lecturas, queda escaneando siempre
  function iniciarScannerContinuo(elementId, callback){
    var html5QrCode = new Html5Qrcode(elementId);
    scannerContinuoActivo = html5QrCode;

    html5QrCode.start(
      { facingMode: "environment" },
      { fps: 10, qrbox: 220 },
      function(decodedText){
        if (bloqueoLectura) return;
        bloqueoLectura = true;
        procesarConCallback(callback, decodedText.trim());
        setTimeout(function(){ bloqueoLectura = false; }, 1500);
      },
      function(err){}
    ).catch(function(err){
      document.getElementById('resultado').innerText = "No se pudo acceder a la camara: " + err;
    });
  }

  function detenerScannerContinuo(){
    if (scannerContinuoActivo){
      scannerContinuoActivo.stop().catch(function(){});
      scannerContinuoActivo = null;
    }
  }

  function procesarConCallback(callback, codigo){
    try{
      if (!maestros){
        mensaje('Los datos todavia no cargaron. Esperá unos segundos y volvé a escanear.', false);
        return;
      }
      callback(codigo);
    } catch(e){
      mensaje('Error inesperado: ' + e.message, false);
    }
  }

  function mensaje(txt, ok){
    var r = document.getElementById('resultado');
    r.innerText = txt;
    r.style.color = ok ? 'green' : 'red';
  }

  // Al escanear el camion, primero se consulta al servidor si tiene
  // un viaje "Abierto" pendiente. Segun la respuesta, se decide si
  // es una Salida (paso4) o una Vuelta (paso5).
  function procesarCamion(codigo){
    var camion = buscar(maestros.camiones, 'Codigo', codigo);
    if (!camion){ mensaje('Camion no reconocido: "' + codigo + '"', false); return; }

    var camionInfo = (camion.Patente||'') + ' - ' + (camion.Chofer||'');
    mensaje('Verificando estado del camion...', true);

    fetch(API_URL + "?action=viajeAbierto&codigo=" + encodeURIComponent(codigo))
      .then(function(res){ return res.json(); })
      .then(function(data){
        if (data.abierto){
          // ----- Es una VUELTA -----
          vuelta = vueltaVacia();
          vuelta.camionCodigo = codigo;
          vuelta.camionInfo = camionInfo;

          mensaje('Camion: ' + camionInfo + ' | Viaje abierto detectado. Escaneá los carros vacios (o finalizá sin carros).', true);
          document.getElementById('infoVuelta').innerText =
            'Camion: ' + camionInfo + ' | Destino de salida: ' + (data.abierto.destinoInfo || '');

          document.getElementById('listaCarrosVuelta').innerHTML = '';
          mostrarPaso(5);
          iniciarScannerContinuo('reader5', procesarCarroVuelta);

        } else {
          // ----- Es una SALIDA -----
          viaje = viajeVacio();
          viaje.camionCodigo = codigo;
          viaje.camionInfo = camionInfo;

          var fh = obtenerFechaHoraLocal();
          viaje.fecha = fh.fecha;
          viaje.hora = fh.hora;

          mensaje('Camion: ' + camionInfo + ' | Viaje iniciado ' + viaje.fecha + ' ' + viaje.hora, true);
          document.getElementById('infoViaje').innerText =
            'Camion: ' + camionInfo + ' | Destino: (se define con el primer carro)';

          refrescarLista();
          mostrarPaso(4);
          iniciarScannerContinuo('reader4', procesarCarro);
        }
      })
      .catch(function(err){ mensaje('Error verificando estado del camion: ' + err, false); });
  }

  function procesarCarro(codigo){
    var tipo = buscar(maestros.tipos, 'Codigo', codigo);
    if (!tipo){ mensaje('Carro no reconocido: "' + codigo + '"', false); return; }
    var familiaCarro = (tipo.Familia || '').toUpperCase();

    if (!viaje.destinoFamilia){
      var destino = buscar(maestros.destinos, 'Nombre', familiaCarro);
      if (!destino){
        mensaje('No se encontro un destino para la familia "' + familiaCarro + '". Revisa la hoja Destinos.', false);
        return;
      }
      viaje.destinoCodigo = destino.Codigo;
      viaje.destinoInfo = destino.Nombre || familiaCarro;
      viaje.destinoFamilia = familiaCarro;
      document.getElementById('infoViaje').innerText =
        'Camion: ' + viaje.camionInfo + ' | Destino: ' + viaje.destinoInfo;
    } else if (familiaCarro !== viaje.destinoFamilia){
      mensaje('RECHAZADO: el carro ' + codigo + ' es de familia ' + familiaCarro + ', no corresponde al destino ' + viaje.destinoFamilia + ' de este viaje.', false);
      return;
    }

    if (viaje.carros.indexOf(codigo) !== -1){
      mensaje('Ese carro ya fue escaneado en este viaje.', false);
      return;
    }
    viaje.carros.push(codigo);
    mensaje('Carro agregado: ' + codigo + ' (' + viaje.carros.length + ')', true);
    refrescarLista();
  }

  // Carros vacios que vuelven. Solo se valida que el codigo exista
  // en TiposCarro; no se compara contra la familia del destino de salida.
  function procesarCarroVuelta(codigo){
    var tipo = buscar(maestros.tipos, 'Codigo', codigo);
    if (!tipo){ mensaje('Carro no reconocido: "' + codigo + '"', false); return; }

    if (vuelta.carros.indexOf(codigo) !== -1){
      mensaje('Ese carro ya fue escaneado en esta vuelta.', false);
      return;
    }
    vuelta.carros.push(codigo);
    mensaje('Carro (vuelta) agregado: ' + codigo + ' (' + vuelta.carros.length + ')', true);
    refrescarListaVuelta();
  }

  function refrescarLista(){
    var ul = document.getElementById('listaCarros');
    ul.innerHTML = '';
    viaje.carros.forEach(function(c, idx){
      var li = document.createElement('li');
      li.innerHTML = '<span>' + (idx+1) + '. ' + c + '</span>';
      var btn = document.createElement('button');
      btn.className = 'quitar';
      btn.innerText = 'Quitar';
      btn.onclick = function(){ viaje.carros.splice(idx,1); refrescarLista(); };
      li.appendChild(btn);
      ul.appendChild(li);
    });
  }

  function refrescarListaVuelta(){
    var ul = document.getElementById('listaCarrosVuelta');
    ul.innerHTML = '';
    vuelta.carros.forEach(function(c, idx){
      var li = document.createElement('li');
      li.innerHTML = '<span>' + (idx+1) + '. ' + c + '</span>';
      var btn = document.createElement('button');
      btn.className = 'quitar';
      btn.innerText = 'Quitar';
      btn.onclick = function(){ vuelta.carros.splice(idx,1); refrescarListaVuelta(); };
      li.appendChild(btn);
      ul.appendChild(li);
    });
  }

  function finalizarViaje(){
    if (viaje.carros.length === 0){ mensaje('Agregá al menos un carro antes de finalizar.', false); return; }
    detenerScannerContinuo();
    fetch(API_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({ action: "guardarViaje", viaje: viaje })
    })
      .then(function(res){ return res.json(); })
      .then(function(res){
        mensaje('Viaje guardado (' + res.filas + ' carros). Listo para el siguiente viaje.', true);
        viaje = viajeVacio();
        refrescarLista();
        mostrarPaso(2);
      })
      .catch(function(err){ mensaje('Error al guardar: ' + err, false); });
  }

  // Cierra el viaje abierto de este camion. No exige un minimo de
  // carros: puede finalizar con 0, 1 o mas carros escaneados.
  function finalizarVuelta(){
    detenerScannerContinuo();

    var fh = obtenerFechaHoraLocal();
    vuelta.fecha = fh.fecha;
    vuelta.hora = fh.hora;

    fetch(API_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({ action: "cerrarViaje", vuelta: vuelta })
    })
      .then(function(res){ return res.json(); })
      .then(function(res){
        if (!res.ok){
          mensaje(res.mensaje || 'Error al cerrar el viaje.', false);
          return;
        }
        mensaje('Vuelta registrada (' + res.carros + ' carros). Listo para el siguiente camion.', true);
        vuelta = vueltaVacia();
        refrescarListaVuelta();
        mostrarPaso(2);
      })
      .catch(function(err){ mensaje('Error al guardar la vuelta: ' + err, false); });
  }

  function buscar(lista, campo, valor){
    for (var i=0;i<lista.length;i++){
      if (String(lista[i][campo]).trim().toUpperCase() === String(valor).trim().toUpperCase()) return lista[i];
    }
    return null;
  }
</script>
</body>
</html>
